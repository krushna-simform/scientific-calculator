<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scientific Calculator - A scientific calculator is a specialized website for performing complex mathematical, statistical, and scientific calculations.">
    <meta name="keywords" content="Scientific, Calculator, Mathematical, Statistical">

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Scientific Calculator">
    <meta property="og:description" content="Scientific Calculator - A scientific calculator is a specialized website for performing complex mathematical, statistical, and scientific calculations.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/images/calculator-cover-page.png">

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Scientific Calculator">
    <meta name="twitter:description" content="Scientific Calculator - A scientific calculator is a specialized website for performing complex mathematical, statistical, and scientific calculations.">
    <meta name="twitter:image" content="/assets/images/calculator-cover-page.png">

    <link rel="icon" href="/assets/icons/calculator-icon.svg">
    <link rel="stylesheet" href="styles/style.css">

    <title>Scientific Calculator</title>
</head>
<body>
    <div class="calculator">
        
        <!-- input field -->
        <div class="input-field">
            <span class="input-field-text" tabindex="0">0</span>
        </div>

        <!-- degree functions -->
        <div class="deg-functions">
            <button
                aria-label="Degree mode"
            >
                <span>DEG</span>
            </button>
            
            <button
                aria-label="Float and Engineering notation"
            >
                <span>F-E</span>
            </button>
        </div>

        <!-- memory functions -->
        <div class="memory-functions">
            <button
                aria-label="Memory Clear"
            >
                <span class="opacity">MC</span>
            </button>

            <button
                aria-label="Memory Recall"
            >
                <span class="opacity">MR</span>
            </button>

            <button
                aria-label="Memory Add"
            >
                <span>M+</span>
            </button>

            <button
                aria-label="Memory Subtract"
            >
                <span>M-</span>
            </button>

            <button
                aria-label="Memory Store"
            >
                <span>MS</span>
            </button>
        </div>

        <!-- trigonometry functions -->
        <div class="trigonometry-functions flex">
            <button
                class="flex"
                aria-label="Trigonometry Functions"
            >
                <img 
                    src="./assets/icons/trigonometry.svg" 
                    alt="Trigonometry icon"
                    id="trigonometry-icon"
                >
                <span>Trigonometry</span>
                <img 
                    src="./assets/icons/drop-down.svg" 
                    alt="Dropdown icon"
                    id="drop-down-icon"
                >
            </button>

            <button
                class="flex"
                aria-label="General Functions"
            >
                <img 
                    src="./assets/icons/functions.svg" 
                    alt="Functions icon"
                    id="function-icon"
                >
                <span>Functions</span>
                <img 
                    src="./assets/icons/drop-down.svg" 
                    alt="Functions icon"
                    id="function-icon"
                >
            </button>
        </div>

        <!-- numeric and operator buttons -->
        <div class="numeric-operator-buttons">
            <button 
                class="function-button"
                aria-label="Second Functions"
            >
                2<sup>nd</sup>
            </button>

            <button 
                class="function-button"
                aria-label="PI"
            >
                π
            </button>

            <button 
                class="function-button"
                aria-label="Euler's Number"
            >
                e
            </button>

            <button 
                class="function-button"
                aria-label="Clear all"
            >
                C
            </button>

            <button 
                class="function-button"
                aria-label="Backspace"
            >
                <img 
                    src="./assets/icons/backspace.svg" 
                    alt="Backspace icon"
                    id="backspace-icon"
                >
            </button>

            <button 
                class="function-button"
                aria-label="Square of x"
            >
                <i>x</i><sup>2</sup>
            </button>

            <button 
                class="function-button"
                aria-label="Reciprocal of x"
            >
                1/<i>x</i>
            </button>

            <button 
                class="function-button"
                aria-label="Absolute value of x"
            >
                |<i> x </i>|
            </button>

            <button 
                class="function-button"
                aria-label="Exponential function"
            >
                exp
            </button>

            <button 
                class="function-button"
                aria-label="Modulo operation"
            >
                mod
            </button>

            <button 
                class="function-button"
                aria-label="Two squareroot of x"
            >
                2√<i>x</i>
            </button>

            <button 
                class="function-button"
                aria-label="Opening parenthesis"
            >
                &#40;
            </button>

            <button 
                class="function-button"
                aria-label="Closing parenthesis"
            >
                &#41;
            </button>

            <button 
                class="function-button"
                aria-label="Factorial"
            >
                <i>n</i>&#33;
            </button>

            <button 
                class="function-button operators-font-size"
                aria-label="Division"
            >
                &#247;
            </button>

            <button 
                class="function-button"
                aria-label="Power of x"
            >
                <i>x</i><sup>y</sup>
            </button>

            <button 
                class="number-button"
                aria-label="Number 7"
            >
                7
            </button>

            <button 
                class="number-button"
                aria-label="Number 8"
            >
                8
            </button>

            <button 
                class="number-button"
                aria-label="Number 9"
            >
                9
            </button>

            <button 
                class="function-button operators-font-size"
                aria-label="Multiplication"
            >
                &#215;
            </button>

            <button 
                class="function-button"
                aria-label="10 to the power of x"
            >
                10<sup><i>x</i></sup>
            </button>

            <button 
                class="number-button"
                aria-label="Number 4"
            >
                4
            </button>

            <button 
                class="number-button"
                aria-label="Number 5"
            >
                5
            </button>

            <button 
                class="number-button"
                aria-label="Number 6"
            >
                6
            </button>

            <button 
                class="function-button operators-font-size"
                aria-label="Minus"
            >
                &#45;	
            </button>

            <button 
                class="function-button"
                aria-label="Logarithm"
            >
                log
            </button>

            <button 
                class="number-button"
                aria-label="Number 1"
            >
                1
            </button>

            <button 
                class="number-button"
                aria-label="Number 2"
            >
                2
            </button>

            <button 
                class="number-button"
                aria-label="Number 3"
            >
                3
            </button>

            <button 
                class="function-button operators-font-size"
                aria-label="Plus"
            >
                &#43;
            </button>

            <button 
                class="function-button"
                aria-label="Natural Logarithm"
            >
                In
            </button>

            <button 
                class="number-button"
                aria-label="Plus-Minus"
            >
                &#43;/&#45;
            </button>

            <button 
                class="number-button"
                aria-label="Number 0"
            >
                0
            </button>

            <button 
                class="number-button"
                aria-label="Decimal point"
            >
                &#46;
            </button>
                
            <button 
                class="function-button operators-font-size"
                id="calculate-button"
                aria-label="Calculate"
            >
                &#61;
            </button>
        </div>
    </div>
</body>
</html>
